<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Diagnóstico de vídeo</title>
<!-- Página temporal para averiguar por qué un móvil no reproduce los vídeos automáticamente. Borrar cuando se resuelva. -->
<style>
  body { font: 15px/1.45 -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; background: #111; color: #eee; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; display: block; }
  .ok { color: #5fd38d; } .bad { color: #ff6b6b; } .warn { color: #ffcc4d; }
  pre { white-space: pre-wrap; word-break: break-word; background: #1c1c1c; padding: 10px; border-radius: 8px; font-size: 12.5px; }
  button { font: inherit; padding: 10px 14px; border-radius: 8px; border: 0; background: #f0531c; color: #fff; margin: 4px 0 12px; }
  small { color: #999; }
</style>
</head>
<body>
<h1>Diagnóstico de vídeo</h1>
<p><small>Haz una captura de esta pantalla cuando el informe deje de cambiar (unos 5 segundos).</small></p>

<div class="row">
  <div><small>A · como en la web (muted + playsinline + play() por JS)</small><video id="a" muted loop playsinline preload="auto" src="/hero/pill.mp4"></video></div>
  <div><small>B · con atributo autoplay</small><video id="b" muted loop playsinline autoplay preload="auto" src="/hero/reel.mp4"></video></div>
</div>
<button id="tap">Tocar para reproducir A y B</button>
<pre id="out">Comprobando…</pre>

<script>
  const out = document.getElementById('out');
  const log = [];
  const add = (cls, txt) => { log.push([cls, txt]); out.innerHTML = log.map(([c, t]) => `<span class="${c}">${t}</span>`).join('\n'); };

  const ua = navigator.userAgent;
  const ios = (ua.match(/OS (\d+)_(\d+)/) || [])[0] || 'no detectado';
  add('', 'Navegador: ' + ua);
  add('', 'iOS: ' + ios.replace('_', '.'));
  add(matchMedia('(prefers-reduced-motion: reduce)').matches ? 'warn' : 'ok', 'Reducir movimiento: ' + (matchMedia('(prefers-reduced-motion: reduce)').matches ? 'ACTIVADO' : 'no'));
  add('', 'Soporta animation-timeline: ' + (CSS.supports && CSS.supports('animation-timeline: view()') ? 'sí' : 'no'));

  const ev = ['loadedmetadata', 'canplay', 'playing', 'pause', 'stalled', 'suspend', 'waiting', 'error'];
  for (const id of ['a', 'b']) {
    const v = document.getElementById(id);
    v.dataset.ev = '';
    ev.forEach(e => v.addEventListener(e, () => { v.dataset.ev += e + ' '; }));
  }

  const a = document.getElementById('a');
  const pr = a.play();
  if (pr && pr.then) pr.then(() => add('ok', 'A · play() automático: OK, se reproduce'))
                       .catch(e => add('bad', 'A · play() automático RECHAZADO: ' + e.name + ' — ' + e.message));

  document.getElementById('tap').addEventListener('click', () => {
    ['a', 'b'].forEach(id => document.getElementById(id).play()
      .then(() => add('ok', id.toUpperCase() + ' · play() tras tocar: OK'))
      .catch(e => add('bad', id.toUpperCase() + ' · play() tras tocar RECHAZADO: ' + e.name)));
  });

  setTimeout(() => {
    for (const id of ['a', 'b']) {
      const v = document.getElementById(id);
      const moving = !v.paused && v.currentTime > 0;
      add(moving ? 'ok' : 'bad', `${id.toUpperCase()} · reproduciéndose: ${moving ? 'sí' : 'NO'} | paused=${v.paused} t=${v.currentTime.toFixed(2)} readyState=${v.readyState} networkState=${v.networkState} error=${v.error ? v.error.code : 'ninguno'}`);
      add('', `${id.toUpperCase()} · eventos: ${v.dataset.ev || '(ninguno)'}`);
    }
    add('', 'Fin del informe.');
  }, 5000);
</script>
</body>
</html>
