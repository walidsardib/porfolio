<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: 'Inter', sans-serif;
    background: #f6f1e9;
    color: #2c2622;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 80px 88px;
  }
  /* glows cálidos */
  .glow1 { position: absolute; width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(circle, rgba(111,140,90,0.22), transparent 70%);
    top: -220px; right: -160px; }
  .glow2 { position: absolute; width: 520px; height: 520px; border-radius: 50%;
    background: radial-gradient(circle, rgba(125,154,102,0.18), transparent 70%);
    bottom: -240px; left: -120px; }
  .eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: 22px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: #5d7a49; margin-bottom: 26px;
    display: flex; align-items: center; gap: 16px; position: relative;
  }
  .eyebrow::before { content: ''; width: 46px; height: 2px; background: #6f8c5a; border-radius: 2px; }
  .name {
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 92px;
    line-height: 1.0; letter-spacing: -0.02em; position: relative; margin-bottom: 24px;
  }
  .name .accent { color: #5d7a49; font-style: italic; }
  .sub {
    font-size: 30px; color: #5f564d; max-width: 760px; line-height: 1.45;
    position: relative; font-weight: 500;
  }
  .foot {
    position: absolute; left: 88px; bottom: 64px;
    display: flex; align-items: center; gap: 14px;
    font-family: 'Space Mono', monospace; font-size: 26px; font-weight: 700; color: #2c2622;
  }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #6f8c5a; }
  .pills {
    position: absolute; right: 88px; bottom: 64px;
    display: flex; gap: 12px; font-family: 'Space Mono', monospace;
    font-size: 18px; font-weight: 700;
  }
  .pill { padding: 9px 18px; border-radius: 999px; background: #dde5d2;
    border: 1px solid rgba(111,140,90,0.4); color: #5d7a49; }
</style>
</head>
<body>
  <div class="glow1"></div>
  <div class="glow2"></div>
  <div class="eyebrow">Desarrollador &amp; diseñador web · Zaragoza</div>
  <div class="name">Walid Sardi <span class="accent">Boukhari</span></div>
  <div class="sub">Páginas web a medida para negocios y marcas. Rápidas, modernas y pensadas para convertir.</div>
  <div class="foot"><span class="dot"></span> walidsardib.es</div>
  <div class="pills"><span class="pill">Diseño</span><span class="pill">Desarrollo</span><span class="pill">SEO</span></div>
</body>
</html>
